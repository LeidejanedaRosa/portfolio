name: CI

# Quando rodar:
#  - pull_request para main  → valida ANTES do merge
#  - push para main          → valida o que já entrou (rede de segurança)
on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

# Se um push novo chega enquanto uma execução antiga do mesmo branch/PR
# ainda roda, cancela a antiga. Economiza minutos de CI.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

# Princípio do menor privilégio (OWASP): o job só precisa LER o código.
permissions:
    contents: read

jobs:
    verify:
        name: Lint · types · tests · build
        runs-on: ubuntu-latest

        steps:
            - name: Checkout do código
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0 # histórico completo, o gitleaks precisa pra varrer todos os commits

            # Ordem: checagem baratas primeiro, para falhar rápido.
            - name: Scan de segredos (gitleaks)
              uses: gitleaks/gitleaks-action@v2
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Configurar Node
              uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc # mesma versão da máquina local (sem "na minha máquina funciona")
                  cache: npm # cacheia ~/.npm entre execuções

            - name: Instalar dependências
              run: npm ci # 'ci' = instala EXATAMENTE o package-lock, sem alterá-lo

            - name: Lint (ESLint)
              run: npm run lint

            - name: Type-check dos testes
              run: npm run test:types

            - name: Testes (Vitest + axe)
              run: npm test

            - name: Build de produção
              run: npm run build # roda 'tsc -b' (type-check da app) + 'vite build'
