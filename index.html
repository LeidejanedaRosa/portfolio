<!doctype html>
<html lang="pt-br">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!--
          Consent Mode (Google): declara o padrão ANTES de qualquer tag poder
          rodar — mesmo que o GTM só seja injetado depois do aceite (ver
          src/consent), isso estabelece a postura padrão "negado" que as tags
          do GA4/Ads dentro do container respeitam nativamente. accept()/
          reject()/reset() em src/consent atualizam isso via gtag('consent',
          'update', ...) — inclusive DEPOIS do GTM já estar rodando, pra
          revogar consentimento no meio da sessão sem precisar recarregar.
        -->
        <script>
            window.dataLayer = window.dataLayer || [];
            function gtag() {
                dataLayer.push(arguments);
            }
            gtag('consent', 'default', { analytics_storage: 'denied' });
        </script>

        <!--
          theme-color (chrome do navegador — barra de status mobile etc.):
          uma meta só (antes eram 2 com `media`, que só seguiam a preferência
          do SO — se o usuário escolhesse um tema diferente do SO dentro do
          app, o chrome nativo ficava com a cor errada), com `id` pra
          ThemeProvider atualizar o `content` toda vez que o tema mudar (ver
          src/theme/index.tsx). Precisa vir ANTES do script anti-flash
          abaixo: o parsing do HTML é sequencial, e o script roda síncrono —
          se a meta viesse depois, `getElementById` não encontrava nada
          ainda no carregamento inicial em tema escuro.
        -->
        <meta id="theme-color-meta" name="theme-color" content="#f8fafc" />

        <!--
          Anti-flash: aplica o tema ANTES do primeiro paint, síncrono.
          Precisa espelhar a lógica de getInitialTheme() em src/theme/index.tsx.
        -->
        <script>
            (function () {
                try {
                    var stored = null;
                    try {
                        stored = localStorage.getItem('theme');
                    } catch (e) {
                        /* localStorage bloqueado — cai no prefers-color-scheme */
                    }
                    var dark =
                        stored === 'light' || stored === 'dark'
                            ? stored === 'dark'
                            : window.matchMedia('(prefers-color-scheme: dark)')
                                  .matches;
                    if (dark) {
                        document.documentElement.classList.add('dark');
                        document.documentElement.style.colorScheme = 'dark';
                        var meta = document.getElementById('theme-color-meta');
                        if (meta) meta.setAttribute('content', '#0f172a');
                    }
                } catch (e) {
                    /* sem matchMedia — mantém tema claro */
                }
            })();
        </script>
        <!-- LCP é a imagem de fundo do hero (Home) — sem preload, o
             navegador só descobre que precisa dela depois de baixar e
             rodar o JS (ela é renderizada por um componente React, não um
             <img> cru no HTML). Lighthouse mediu ~3,1s de LCP só por causa
             disso. fetchpriority="high" reforça a prioridade além do
             preload em si. -->
        <link
            rel="preload"
            as="image"
            href="/src/assets/images/home-hero-bg.webp"
            fetchpriority="high"
        />
        <link rel="icon" href="favicon.ico" />
        <link rel="apple-touch-icon" href="logo192.png" />
        <link rel="manifest" href="manifest.json" />

        <!-- Fontes: self-hosted via @fontsource, importadas em src/index.tsx (sem CDN de terceiros) -->

        <title>Leidejane da Rosa | Engenheira de Software</title>
        <meta
            name="title"
            content="Leidejane da Rosa | Engenheira de Software"
        />
        <meta
            name="description"
            content="Portfólio de Leidejane da Rosa, Engenheira de Software — projetos com foco em arquitetura, acessibilidade e boas práticas."
        />

        <!--
          Canônico: o site responde tanto em leidejanedarosa.dev.br quanto em
          leidejanedarosa.vercel.app (o domínio da Vercel continua no ar,
          redirecionando) — sem isso, buscadores podiam indexar os dois como
          páginas diferentes com o mesmo conteúdo. Aponta sempre pro domínio
          próprio, a versão "oficial" (achado da auditoria de 2026-10).
        -->
        <link rel="canonical" href="https://leidejanedarosa.dev.br/" />

        <!--
          Open Graph: descreve ESTA página quando compartilhada (não o perfil externo do
          GitHub/LinkedIn — links pra eles ficam no conteúdo da seção de contato).
        -->
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://leidejanedarosa.dev.br/" />
        <meta
            property="og:title"
            content="Leidejane da Rosa | Engenheira de Software"
        />
        <meta
            property="og:description"
            content="Portfólio de Leidejane da Rosa, Engenheira de Software — projetos com foco em arquitetura, acessibilidade e boas práticas."
        />
        <meta
            property="og:image"
            content="https://leidejanedarosa.dev.br/og-image.webp"
        />

        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@type": "Person",
                "name": "Leidejane da Rosa",
                "jobTitle": "Engenheira de Software",
                "url": "https://leidejanedarosa.dev.br/",
                "sameAs": [
                    "https://github.com/LeidejanedaRosa",
                    "https://www.linkedin.com/in/leidejane/"
                ]
            }
        </script>

        <!--
          O GTM NÃO carrega mais aqui. Ele só é injetado via JS depois do
          aceite explícito no banner de cookies (ver src/consent e
          src/lib/load-gtm) — exigência da LGPD. Por isso também não há mais
          o <iframe> de fallback pra no-script: sem JS não tem como pedir
          consentimento, então sem JS não há rastreamento nenhum.
        -->
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
        <script type="module" src="/src/index.tsx"></script>
    </body>
</html>
