<!doctype html>
<html lang="pt-br">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!--
          Anti-flash: aplica o tema ANTES do primeiro paint, síncrono.
          Precisa espelhar a lógica de getInitialTheme() em src/theme/index.tsx.
        -->
        <script>
            (function () {
                try {
                    var stored = null;
                    try {
                        stored = localStorage.getItem('theme');
                    } catch (e) {
                        /* localStorage bloqueado — cai no prefers-color-scheme */
                    }
                    var dark =
                        stored === 'light' || stored === 'dark'
                            ? stored === 'dark'
                            : window.matchMedia('(prefers-color-scheme: dark)')
                                  .matches;
                    if (dark) {
                        document.documentElement.classList.add('dark');
                        document.documentElement.style.colorScheme = 'dark';
                    }
                } catch (e) {
                    /* sem matchMedia — mantém tema claro */
                }
            })();
        </script>

        <meta
            name="theme-color"
            content="#f8fafc"
            media="(prefers-color-scheme: light)"
        />
        <meta
            name="theme-color"
            content="#0f172a"
            media="(prefers-color-scheme: dark)"
        />
        <link rel="icon" href="favicon.ico" />
        <link rel="apple-touch-icon" href="logo192.png" />
        <link rel="manifest" href="manifest.json" />

        <!-- Fontes: self-hosted via @fontsource, importadas em src/index.tsx (sem CDN de terceiros) -->

        <title>Leidejane da Rosa | Engenheira de Software</title>
        <meta
            name="title"
            content="Leidejane da Rosa | Engenheira de Software"
        />
        <meta
            name="description"
            content="Portfólio de Leidejane da Rosa, Engenheira de Software — projetos com foco em arquitetura, acessibilidade e boas práticas."
        />

        <!--
          Open Graph: descreve ESTA página quando compartilhada (não o perfil externo do
          GitHub/LinkedIn — links pra eles ficam no conteúdo da seção de contato).
          TODO: trocar a URL de placeholder pela URL real assim que o site for publicado.
        -->
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://SEU-DOMINIO-AQUI.exemplo/" />
        <meta
            property="og:title"
            content="Leidejane da Rosa | Engenheira de Software"
        />
        <meta
            property="og:description"
            content="Portfólio de Leidejane da Rosa, Engenheira de Software — projetos com foco em arquitetura, acessibilidade e boas práticas."
        />
        <meta
            property="og:image"
            content="https://SEU-DOMINIO-AQUI.exemplo/og-image.webp"
        />

        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@type": "Person",
                "name": "Leidejane da Rosa",
                "jobTitle": "Engenheira de Software",
                "url": "https://SEU-DOMINIO-AQUI.exemplo/",
                "sameAs": [
                    "https://github.com/LeidejanedaRosa",
                    "https://www.linkedin.com/in/leidejane-da-rosa-a98544205/"
                ]
            }
        </script>

        <!--
          O GTM NÃO carrega mais aqui. Ele só é injetado via JS depois do
          aceite explícito no banner de cookies (ver src/consent e
          src/lib/load-gtm) — exigência da LGPD. Por isso também não há mais
          o <iframe> de fallback pra no-script: sem JS não tem como pedir
          consentimento, então sem JS não há rastreamento nenhum.
        -->
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
        <script type="module" src="/src/index.tsx"></script>
    </body>
</html>
